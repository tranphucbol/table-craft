# The databases `bun run test:db` runs the plugin contract against, seeded from ./schema.
# Ports sit far from the defaults so a developer's own server keeps 5432 and 3306. Parallel
# worktrees each set COMPOSE_PROJECT_NAME, TABLE_CRAFT_PG_PORT, TABLE_CRAFT_MYSQL_PORT,
# TABLE_CRAFT_MARIADB_PORT, TABLE_CRAFT_TIDB_PORT, TABLE_CRAFT_SSH_PORT,
# TABLE_CRAFT_PG_TLS_PORT, TABLE_CRAFT_MYSQL_TLS_PORT, TABLE_CRAFT_ORACLE_PORT,
# TABLE_CRAFT_MSSQL_PORT, TABLE_CRAFT_ETCD_PORT and TABLE_CRAFT_ETCD35_PORT so one checkout's `up` never recreates the containers another checkout is
# testing against.
# Every database service sits behind a profile named after the database (decision 099):
# `TABLE_CRAFT_DATABASES` (default `mysql,tidb,mariadb`) picks the profiles `stack.ts` passes.
# Each seeded service is labelled with the hash of its seed (`stack.ts`), so `bun test/db/up.ts`
# and the headless runner recreate, and so reseed, exactly the containers whose seed changed.
name: table-craft-test-db

services:
  postgres:
    profiles: ["postgres"]
    image: postgres:17-alpine
    labels:
      table-craft.seed: ${TABLE_CRAFT_PG_SEED:-none}
    environment:
      POSTGRES_USER: table_craft
      POSTGRES_PASSWORD: table_craft
      POSTGRES_DB: table_craft
    ports:
      - "127.0.0.1:${TABLE_CRAFT_PG_PORT:-55432}:5432"
    volumes:
      - ./schema/postgres.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # Over TCP and against the seeded table: the entrypoint's temporary server answers on the
      # socket before the schema is loaded.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U table_craft -d table_craft -c 'SELECT 1 FROM type_probe LIMIT 1'"]
      interval: 1s
      timeout: 5s
      retries: 60

  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    labels:
      table-craft.seed: ${TABLE_CRAFT_MYSQL_SEED:-none}
    environment:
      MYSQL_ROOT_PASSWORD: table_craft
      MYSQL_USER: table_craft
      MYSQL_PASSWORD: table_craft
      MYSQL_DATABASE: table_craft
    # Stock MySQL takes ~650 MB idle, mostly a 128 MB buffer pool, a 100 MB redo log and the binary
    # log on tmpfs, plus performance_schema; the fixtures fit in a few MB. performance_schema stays
    # on because the session list reads `data_lock_waits` and `threads` (plugins/mysql/src/sessions.ts),
    # with its digests, long histories and per-account summaries sized to nothing.
    command:
      - --innodb-buffer-pool-size=32M
      - --innodb-redo-log-capacity=8M
      - --innodb-log-buffer-size=1M
      - --skip-log-bin
      - --performance-schema-digests-size=0
      - --performance-schema-max-digest-length=0
      - --performance-schema-max-sql-text-length=0
      - --performance-schema-error-size=0
      - --performance-schema-events-stages-history-long-size=0
      - --performance-schema-events-statements-history-long-size=0
      - --performance-schema-events-transactions-history-long-size=0
      - --performance-schema-events-waits-history-long-size=0
      - --performance-schema-accounts-size=0
      - --performance-schema-hosts-size=0
      - --performance-schema-users-size=0
    ports:
      - "127.0.0.1:${TABLE_CRAFT_MYSQL_PORT:-53306}:3306"
    volumes:
      - ./schema/mysql.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # Over TCP for the same reason: the entrypoint's temporary server listens on the socket only.
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 -u table_craft -ptable_craft table_craft -e 'SELECT 1 FROM type_probe LIMIT 1'",
        ]
      interval: 1s
      timeout: 5s
      retries: 120

  # MariaDB 10.11 LTS, which users reach through the MySQL plugin: JSON is LONGTEXT with a
  # json_valid check, routines live in mysql.proc, and STATISTICS has no EXPRESSION.
  mariadb:
    profiles: ["mariadb"]
    image: mariadb:10.11
    labels:
      table-craft.seed: ${TABLE_CRAFT_MARIADB_SEED:-none}
    environment:
      MARIADB_ROOT_PASSWORD: table_craft
      MARIADB_USER: table_craft
      MARIADB_PASSWORD: table_craft
      MARIADB_DATABASE: table_craft
    command:
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=1M
    ports:
      - "127.0.0.1:${TABLE_CRAFT_MARIADB_PORT:-53310}:3306"
    volumes:
      - ./schema/mysql.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb -h 127.0.0.1 -u table_craft -ptable_craft table_craft -e 'SELECT 1 FROM type_probe LIMIT 1'",
        ]
      interval: 1s
      timeout: 5s
      retries: 120

  # TLS-only servers for plan 037, signed by the test CA in ./tls (every key there is test-only).
  # The image refuses a key file the postgres user does not own, so the entrypoint copies it first.
  postgres-tls:
    profiles: ["postgres"]
    image: postgres:17-alpine
    labels:
      table-craft.seed: ${TABLE_CRAFT_PG_TLS_SEED:-none}
    environment:
      POSTGRES_USER: table_craft
      POSTGRES_PASSWORD: table_craft
      POSTGRES_DB: table_craft
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -o postgres -g postgres -m 600 /tls/server.key /tmp/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tls/server.crt
        -c ssl_key_file=/tmp/server.key -c ssl_ca_file=/tls/ca.crt -c hba_file=/tls/pg_hba.conf
    ports:
      - "127.0.0.1:${TABLE_CRAFT_PG_TLS_PORT:-55433}:5432"
    volumes:
      - ./tls:/tls:ro
      - ./tls/postgres.sql:/docker-entrypoint-initdb.d/tls.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=table_craft psql 'host=127.0.0.1 sslmode=require user=table_craft dbname=table_craft' -c 'SELECT 1 FROM tls_probe'",
        ]
      interval: 1s
      timeout: 5s
      retries: 60

  mysql-tls:
    profiles: ["mysql"]
    image: mysql:8.4
    labels:
      table-craft.seed: ${TABLE_CRAFT_MYSQL_TLS_SEED:-none}
    environment:
      MYSQL_ROOT_PASSWORD: table_craft
      MYSQL_USER: table_craft
      MYSQL_PASSWORD: table_craft
      MYSQL_DATABASE: table_craft
    command:
      - --innodb-buffer-pool-size=32M
      - --innodb-redo-log-capacity=8M
      - --innodb-log-buffer-size=1M
      - --skip-log-bin
      - --performance-schema=OFF
      - --require-secure-transport=ON
      - --ssl-ca=/tls/ca.crt
      - --ssl-cert=/tls/server.crt
      - --ssl-key=/tls/server.key
    ports:
      - "127.0.0.1:${TABLE_CRAFT_MYSQL_TLS_PORT:-53307}:3306"
    volumes:
      - ./tls:/tls:ro
      - ./tls/mysql.sql:/docker-entrypoint-initdb.d/tls.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 --ssl-mode=REQUIRED -u table_craft -ptable_craft table_craft -e 'SELECT 1 FROM tls_probe'",
        ]
      interval: 1s
      timeout: 5s
      retries: 120

  # The bastion plan 036 tunnels through: it reaches the databases by service name, so a tunnel
  # targets postgres:5432, mysql:3306, oracle:1521 and mssql:1433 wherever the test runs. Keys in
  # ./ssh are test-only.
  ssh:
    profiles: ["mysql", "postgres", "oracle", "mssql"]
    build: ./ssh
    image: table-craft-ssh:local
    ports:
      - "127.0.0.1:${TABLE_CRAFT_SSH_PORT:-2222}:22"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Redis for plans 058 and 060: 7.4, 6.2 and 5.0, standalone and Cluster, each seeded from ./schema/redis.redis
  # by its own entrypoint once the server answers (Redis has no initdb directory); the
  # healthchecks wait for the seed's last key. ACL users: `table_craft` (everything) and `limited`
  # (no MEMORY, OBJECT, CONFIG). A cluster runs its nodes in one container, listening on the very
  # ports it publishes and announcing 127.0.0.1, so a client on the host follows the announced
  # addresses as they are and the headless box maps them to `<service>:<port>` (Node address
  # map). Ports stay below 55536 because a 6.2 node's bus port is its port + 10000.
  redis:
    profiles: ["redis"]
    image: redis:7.4-alpine
    labels:
      table-craft.seed: ${TABLE_CRAFT_REDIS_SEED:-none}
    entrypoint: ["/bin/sh", "/redis/standalone.sh"]
    ports:
      - "127.0.0.1:${TABLE_CRAFT_REDIS_PORT:-56379}:6379"
    volumes:
      - ./redis:/redis:ro
      - ./schema:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli GET seed:probe | grep -q 1"]
      interval: 1s
      timeout: 5s
      retries: 60

  redis-tls:
    profiles: ["redis"]
    image: redis:7.4-alpine
    labels:
      table-craft.seed: ${TABLE_CRAFT_REDIS_TLS_SEED:-none}
    environment:
      REDIS_TLS: "1"
    entrypoint: ["/bin/sh", "/redis/standalone.sh"]
    ports:
      - "127.0.0.1:${TABLE_CRAFT_REDIS_TLS_PORT:-56380}:6379"
    volumes:
      - ./redis:/redis:ro
      - ./schema:/seed:ro
      - ./tls:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /tls/ca.crt GET seed:probe | grep -q 1"]
      interval: 1s
      timeout: 5s
      retries: 60

  redis-6:
    profiles: ["redis"]
    image: redis:6.2-alpine
    labels:
      table-craft.seed: ${TABLE_CRAFT_REDIS6_SEED:-none}
    entrypoint: ["/bin/sh", "/redis/standalone.sh"]
    ports:
      - "127.0.0.1:${TABLE_CRAFT_REDIS6_PORT:-56362}:6379"
    volumes:
      - ./redis:/redis:ro
      - ./schema:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli GET seed:probe | grep -q 1"]
      interval: 1s
      timeout: 5s
      retries: 60

  redis-cluster:
    profiles: ["redis"]
    image: redis:7.4-alpine
    labels:
      table-craft.seed: ${TABLE_CRAFT_REDIS_CLUSTER_SEED:-none}
    environment:
      CLUSTER_PORTS: ${TABLE_CRAFT_REDIS_CLUSTER_PORTS:-47001-47006}
      CLUSTER_REPLICAS: "1"
    entrypoint: ["/bin/sh", "/redis/cluster.sh"]
    ports:
      - "127.0.0.1:${TABLE_CRAFT_REDIS_CLUSTER_PORTS:-47001-47006}:${TABLE_CRAFT_REDIS_CLUSTER_PORTS:-47001-47006}"
    volumes:
      - ./redis:/redis:ro
      - ./schema:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded"]
      interval: 1s
      timeout: 5s
      retries: 120

  redis-6-cluster:
    profiles: ["redis"]
    image: redis:6.2-alpine
    labels:
      table-craft.seed: ${TABLE_CRAFT_REDIS6_CLUSTER_SEED:-none}
    environment:
      CLUSTER_PORTS: ${TABLE_CRAFT_REDIS6_CLUSTER_PORTS:-47011-47013}
      CLUSTER_REPLICAS: "0"
    entrypoint: ["/bin/sh", "/redis/cluster.sh"]
    ports:
      - "127.0.0.1:${TABLE_CRAFT_REDIS6_CLUSTER_PORTS:-47011-47013}:${TABLE_CRAFT_REDIS6_CLUSTER_PORTS:-47011-47013}"
    volumes:
      - ./redis:/redis:ro
      - ./schema:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded"]
      interval: 1s
      timeout: 5s
      retries: 120

  # Redis 5.0 for plan 060, the oldest version the plugin supports: no ACL users, one password
  # (users.sh), standalone and a three-primary, three-replica cluster like the QC one.
  redis-5:
    profiles: ["redis"]
    image: redis:5.0-alpine
    labels:
      table-craft.seed: ${TABLE_CRAFT_REDIS5_SEED:-none}
    environment:
      REDIS_AUTH: password
      REDISCLI_AUTH: table_craft
    entrypoint: ["/bin/sh", "/redis/standalone.sh"]
    ports:
      - "127.0.0.1:${TABLE_CRAFT_REDIS5_PORT:-56350}:6379"
    volumes:
      - ./redis:/redis:ro
      - ./schema:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli GET seed:probe | grep -q 1"]
      interval: 1s
      timeout: 5s
      retries: 60

  redis-5-cluster:
    profiles: ["redis"]
    image: redis:5.0-alpine
    labels:
      table-craft.seed: ${TABLE_CRAFT_REDIS5_CLUSTER_SEED:-none}
    environment:
      REDIS_AUTH: password
      REDISCLI_AUTH: table_craft
      CLUSTER_PORTS: ${TABLE_CRAFT_REDIS5_CLUSTER_PORTS:-47021-47026}
      CLUSTER_REPLICAS: "1"
    entrypoint: ["/bin/sh", "/redis/cluster.sh"]
    ports:
      - "127.0.0.1:${TABLE_CRAFT_REDIS5_CLUSTER_PORTS:-47021-47026}:${TABLE_CRAFT_REDIS5_CLUSTER_PORTS:-47021-47026}"
    volumes:
      - ./redis:/redis:ro
      - ./schema:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded"]
      interval: 1s
      timeout: 5s
      retries: 120

  # etcd for plan 110: 3.6 with auth on (users root, table_craft and limited, made by the seeder)
  # and 3.5 without auth. The images are distroless, so `etcd-seed` (Alpine with etcdctl) seeds
  # both from ./schema/etcd.etcd, turns auth on last, then stays up: its healthcheck is what
  # `up --wait` waits on. One member each, data on tmpfs.
  etcd:
    profiles: ["etcd"]
    image: gcr.io/etcd-development/etcd:v3.6.5
    labels:
      table-craft.seed: ${TABLE_CRAFT_ETCD_SEED:-none}
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:${TABLE_CRAFT_ETCD_PORT:-52379}
      - --listen-peer-urls=http://127.0.0.1:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=etcd=http://127.0.0.1:2380
    ports:
      - "127.0.0.1:${TABLE_CRAFT_ETCD_PORT:-52379}:2379"
    tmpfs:
      - /var/lib/etcd
    healthcheck:
      # With auth on, 3.6 reports an anonymous health check unhealthy; before, the user is ignored.
      test: ["CMD", "/usr/local/bin/etcdctl", "--user=root:table_craft", "endpoint", "health"]
      interval: 1s
      timeout: 5s
      retries: 60

  etcd-3-5:
    profiles: ["etcd"]
    image: gcr.io/etcd-development/etcd:v3.5.21
    labels:
      table-craft.seed: ${TABLE_CRAFT_ETCD35_SEED:-none}
    command:
      - /usr/local/bin/etcd
      - --name=etcd-3-5
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:${TABLE_CRAFT_ETCD35_PORT:-52380}
      - --listen-peer-urls=http://127.0.0.1:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=etcd-3-5=http://127.0.0.1:2380
    ports:
      - "127.0.0.1:${TABLE_CRAFT_ETCD35_PORT:-52380}:2379"
    tmpfs:
      - /var/lib/etcd
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 1s
      timeout: 5s
      retries: 60

  etcd-seed:
    profiles: ["etcd"]
    build: ./etcd
    image: table-craft-etcd-seed:local
    labels:
      table-craft.seed: ${TABLE_CRAFT_ETCD_SEED:-none}-${TABLE_CRAFT_ETCD35_SEED:-none}
    depends_on:
      etcd:
        condition: service_healthy
      etcd-3-5:
        condition: service_healthy
    environment:
      ETCD_SEED_ENDPOINTS: etcd:2379 etcd-3-5:2379
      ETCD_AUTH_ENDPOINT: etcd:2379
    entrypoint: ["/bin/sh", "/etcd/seed.sh"]
    volumes:
      - ./etcd:/etcd:ro
      - ./schema:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/seeded"]
      interval: 1s
      timeout: 5s
      retries: 120

  # The headless box the smoke and live tests run in (plan 031), on this project's network so it
  # reaches the databases by service name. Only `--profile e2e` starts it.
  e2e:
    profiles: ["e2e"]
    # The headless runner sets BUN_VERSION from .bun-version; unset, the Dockerfile default applies.
    build:
      context: ../e2e/docker
      args:
        BUN_VERSION:
    image: table-craft-e2e:local
    working_dir: /work
    shm_size: 1gb
    init: true
    environment:
      TABLE_CRAFT_HEADLESS: "1"
      TABLE_CRAFT_PG_HOST: postgres
      TABLE_CRAFT_PG_PORT: "5432"
      TABLE_CRAFT_MYSQL_HOST: mysql
      TABLE_CRAFT_MYSQL_PORT: "3306"
      TABLE_CRAFT_MARIADB_HOST: mariadb
      TABLE_CRAFT_MARIADB_PORT: "3306"
      TABLE_CRAFT_PG_TLS_HOST: postgres-tls
      TABLE_CRAFT_PG_TLS_PORT: "5432"
      TABLE_CRAFT_MYSQL_TLS_HOST: mysql-tls
      TABLE_CRAFT_MYSQL_TLS_PORT: "3306"
      # A remote TiDB replaces the container when it answers (../db/tidbTarget.ts).
      TABLE_CRAFT_TIDB_HOST: ${TABLE_CRAFT_TIDB_E2E_HOST:-tidb}
      TABLE_CRAFT_TIDB_PORT: ${TABLE_CRAFT_TIDB_E2E_PORT:-4000}
      TABLE_CRAFT_TIDB_USER: ${TABLE_CRAFT_TIDB_USER:-root}
      TABLE_CRAFT_TIDB_PASSWORD: ${TABLE_CRAFT_TIDB_PASSWORD:-}
      TABLE_CRAFT_SSH_HOST: ssh
      TABLE_CRAFT_SSH_PORT: "22"
      TABLE_CRAFT_ORACLE_HOST: oracle
      TABLE_CRAFT_ORACLE_PORT: "1521"
      TABLE_CRAFT_MSSQL_HOST: mssql
      TABLE_CRAFT_MSSQL_PORT: "1433"
      TABLE_CRAFT_REDIS_HOST: redis
      TABLE_CRAFT_REDIS_PORT: "6379"
      TABLE_CRAFT_REDIS_TLS_HOST: redis-tls
      TABLE_CRAFT_REDIS_TLS_PORT: "6379"
      TABLE_CRAFT_REDIS6_HOST: redis-6
      TABLE_CRAFT_REDIS6_PORT: "6379"
      # Cluster nodes announce 127.0.0.1; the test configs map them to these names (plan 058).
      TABLE_CRAFT_REDIS_CLUSTER_HOST: redis-cluster
      TABLE_CRAFT_REDIS_CLUSTER_PORTS: ${TABLE_CRAFT_REDIS_CLUSTER_PORTS:-47001-47006}
      TABLE_CRAFT_REDIS6_CLUSTER_HOST: redis-6-cluster
      TABLE_CRAFT_REDIS6_CLUSTER_PORTS: ${TABLE_CRAFT_REDIS6_CLUSTER_PORTS:-47011-47013}
      TABLE_CRAFT_REDIS5_HOST: redis-5
      TABLE_CRAFT_REDIS5_PORT: "6379"
      TABLE_CRAFT_REDIS5_CLUSTER_HOST: redis-5-cluster
      TABLE_CRAFT_REDIS5_CLUSTER_PORTS: ${TABLE_CRAFT_REDIS5_CLUSTER_PORTS:-47021-47026}
      TABLE_CRAFT_ETCD_HOST: etcd
      TABLE_CRAFT_ETCD_PORT: "2379"
      TABLE_CRAFT_ETCD35_HOST: etcd-3-5
      TABLE_CRAFT_ETCD35_PORT: "2379"
      TABLE_CRAFT_DATABASES: ${TABLE_CRAFT_DATABASES:-}
      TABLE_CRAFT_EVIDENCE_DIR: ${TABLE_CRAFT_EVIDENCE_DIR:-}
    volumes:
      - ../..:/work
      - node-modules:/work/node_modules
      - node-modules-plugin-api:/work/packages/plugin-api/node_modules
      - node-modules-core:/work/packages/core/node_modules
      - node-modules-desktop:/work/packages/desktop/node_modules
      - node-modules-postgres:/work/plugins/postgres/node_modules
      - node-modules-mysql:/work/plugins/mysql/node_modules
      - node-modules-sqlite:/work/plugins/sqlite/node_modules
      - node-modules-redis:/work/plugins/redis/node_modules
      - node-modules-oracle:/work/plugins/oracle/node_modules
      - node-modules-mssql:/work/plugins/mssql/node_modules
      - node-modules-etcd:/work/plugins/etcd/node_modules
      - bun-cache:/root/.bun/install/cache
      - electron-cache:/root/.cache/electron

  # TiDB 4.0, the oldest MySQL-compatible server users run against (plan 027): no plain KILL
  # QUERY, no recursive CTE. One process on its embedded store; root has no password and the
  # tests create what they need. Only `--profile tidb` starts it, which test/db/up.ts and the
  # headless runner pass unless a remote TiDB answers (test/db/tidbTarget.ts).
  tidb:
    profiles: ["tidb"]
    image: pingcap/tidb:v4.0.14
    platform: linux/amd64
    ports:
      - "127.0.0.1:${TABLE_CRAFT_TIDB_PORT:-54000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:10080/status"]
      interval: 1s
      timeout: 5s
      retries: 120

  # Oracle Database 23ai Free, arm64-native; no free 19c image exists, so plan 054 keeps to 19c
  # syntax. The image runs ./schema/oracle once, as SYS, after it has made the TABLE_CRAFT user.
  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim-faststart
    labels:
      table-craft.seed: ${TABLE_CRAFT_ORACLE_SEED:-none}
    environment:
      ORACLE_PASSWORD: table_craft
      APP_USER: table_craft
      APP_USER_PASSWORD: table_craft
    ports:
      - "127.0.0.1:${TABLE_CRAFT_ORACLE_PORT:-51521}:1521"
    volumes:
      - ./schema/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      # The seeded table, not the image's healthcheck.sh: the listener opens before the seed runs.
      test:
        [
          "CMD-SHELL",
          "printf 'WHENEVER SQLERROR EXIT 1\\nSELECT 1 FROM seed_probe;\\n' | sqlplus -s -L table_craft/table_craft@//127.0.0.1/FREEPDB1",
        ]
      interval: 2s
      timeout: 10s
      retries: 150

  # SQL Server 2022, amd64 only, so emulated on Apple silicon; plan 055 keeps to 2017 syntax. The
  # image has no initdb directory: `mssql-seed` runs ./schema/mssql.sql once the server answers, and
  # the healthcheck waits for its sentinel. The data directory stays on the container's own layer,
  # since SQL Server needs O_DIRECT, which tmpfs lacks.
  mssql:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    labels:
      table-craft.seed: ${TABLE_CRAFT_MSSQL_SEED:-none}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: TableCraft_sa1
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:${TABLE_CRAFT_MSSQL_PORT:-51433}:1433"
    # Encryption stays optional, so plain logins work, but the server presents the test-only
    # certificate in ./tls: the TLS suite verifies it against ca.crt. TLS 1.3 crashes the server
    # under amd64 emulation, and SQL Server 2022 on Linux refuses strict (TDS 8.0) logins.
    volumes:
      - ./tls:/tls:ro
      - ./tls/mssql.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -b -S 127.0.0.1 -U table_craft -P table_craft -d table_craft -Q 'SELECT 1 FROM seed_probe'",
        ]
      interval: 2s
      timeout: 10s
      retries: 150

  # Stays up after seeding: `docker compose up --wait` fails on a container that exited.
  mssql-seed:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    labels:
      table-craft.seed: ${TABLE_CRAFT_MSSQL_SEED:-none}
    depends_on:
      mssql:
        condition: service_started
    volumes:
      - ./schema/mssql.sql:/seed/mssql.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - >-
        for attempt in $$(seq 1 150); do
        /opt/mssql-tools18/bin/sqlcmd -C -b -S mssql -U sa -P TableCraft_sa1 -Q 'SELECT 1' >/dev/null 2>&1 && break;
        sleep 2; done;
        /opt/mssql-tools18/bin/sqlcmd -C -b -f 65001 -S mssql -U sa -P TableCraft_sa1 -i /seed/mssql.sql || exit 1;
        exec sleep infinity
    restart: "no"

volumes:
  node-modules:
  node-modules-plugin-api:
  node-modules-core:
  node-modules-desktop:
  node-modules-postgres:
  node-modules-mysql:
  node-modules-sqlite:
  node-modules-redis:
  node-modules-oracle:
  node-modules-mssql:
  node-modules-etcd:
  # Downloads only, shared by every checkout; node_modules stay per checkout.
  bun-cache:
    name: table-craft-e2e-bun-cache
  electron-cache:
    name: table-craft-e2e-electron-cache
