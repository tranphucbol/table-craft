# The databases `bun run test:db` runs the plugin contract against, seeded from ./schema.
# Ports sit far from the defaults so a developer's own server keeps 5432 and 3306. Parallel
# worktrees each set COMPOSE_PROJECT_NAME, TABLE_CRAFT_PG_PORT, TABLE_CRAFT_MYSQL_PORT,
# TABLE_CRAFT_TIDB_PORT, TABLE_CRAFT_SSH_PORT, TABLE_CRAFT_PG_TLS_PORT and TABLE_CRAFT_MYSQL_TLS_PORT so one
# checkout's `up` never recreates the containers another checkout is testing against.
name: table-craft-test-db

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: table_craft
      POSTGRES_PASSWORD: table_craft
      POSTGRES_DB: table_craft
    ports:
      - "127.0.0.1:${TABLE_CRAFT_PG_PORT:-55432}:5432"
    volumes:
      - ./schema/postgres.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # Over TCP and against the seeded table: the entrypoint's temporary server answers on the
      # socket before the schema is loaded.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U table_craft -d table_craft -c 'SELECT 1 FROM type_probe LIMIT 1'"]
      interval: 1s
      timeout: 5s
      retries: 60

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: table_craft
      MYSQL_USER: table_craft
      MYSQL_PASSWORD: table_craft
      MYSQL_DATABASE: table_craft
    ports:
      - "127.0.0.1:${TABLE_CRAFT_MYSQL_PORT:-53306}:3306"
    volumes:
      - ./schema/mysql.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # Over TCP for the same reason: the entrypoint's temporary server listens on the socket only.
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 -u table_craft -ptable_craft table_craft -e 'SELECT 1 FROM type_probe LIMIT 1'",
        ]
      interval: 1s
      timeout: 5s
      retries: 120

  # TLS-only servers for plan 037, signed by the test CA in ./tls (every key there is test-only).
  # The image refuses a key file the postgres user does not own, so the entrypoint copies it first.
  postgres-tls:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: table_craft
      POSTGRES_PASSWORD: table_craft
      POSTGRES_DB: table_craft
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -o postgres -g postgres -m 600 /tls/server.key /tmp/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tls/server.crt
        -c ssl_key_file=/tmp/server.key -c ssl_ca_file=/tls/ca.crt -c hba_file=/tls/pg_hba.conf
    ports:
      - "127.0.0.1:${TABLE_CRAFT_PG_TLS_PORT:-55433}:5432"
    volumes:
      - ./tls:/tls:ro
      - ./tls/postgres.sql:/docker-entrypoint-initdb.d/tls.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=table_craft psql 'host=127.0.0.1 sslmode=require user=table_craft dbname=table_craft' -c 'SELECT 1 FROM tls_probe'",
        ]
      interval: 1s
      timeout: 5s
      retries: 60

  mysql-tls:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: table_craft
      MYSQL_USER: table_craft
      MYSQL_PASSWORD: table_craft
      MYSQL_DATABASE: table_craft
    command:
      - --require-secure-transport=ON
      - --ssl-ca=/tls/ca.crt
      - --ssl-cert=/tls/server.crt
      - --ssl-key=/tls/server.key
    ports:
      - "127.0.0.1:${TABLE_CRAFT_MYSQL_TLS_PORT:-53307}:3306"
    volumes:
      - ./tls:/tls:ro
      - ./tls/mysql.sql:/docker-entrypoint-initdb.d/tls.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 --ssl-mode=REQUIRED -u table_craft -ptable_craft table_craft -e 'SELECT 1 FROM tls_probe'",
        ]
      interval: 1s
      timeout: 5s
      retries: 120

  # The bastion plan 036 tunnels through: it reaches the databases by service name, so a tunnel
  # targets postgres:5432 and mysql:3306 wherever the test runs. Keys in ./ssh are test-only.
  ssh:
    build: ./ssh
    image: table-craft-ssh:local
    ports:
      - "127.0.0.1:${TABLE_CRAFT_SSH_PORT:-2222}:22"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 1s
      timeout: 5s
      retries: 30

  # The headless box the smoke and live tests run in (plan 031), on this project's network so it
  # reaches the databases by service name. Only `--profile e2e` starts it.
  e2e:
    profiles: ["e2e"]
    # The headless runner sets BUN_VERSION from .bun-version; unset, the Dockerfile default applies.
    build:
      context: ../e2e/docker
      args:
        BUN_VERSION:
    image: table-craft-e2e:local
    working_dir: /work
    shm_size: 1gb
    init: true
    environment:
      TABLE_CRAFT_HEADLESS: "1"
      TABLE_CRAFT_PG_HOST: postgres
      TABLE_CRAFT_PG_PORT: "5432"
      TABLE_CRAFT_MYSQL_HOST: mysql
      TABLE_CRAFT_MYSQL_PORT: "3306"
      TABLE_CRAFT_PG_TLS_HOST: postgres-tls
      TABLE_CRAFT_PG_TLS_PORT: "5432"
      TABLE_CRAFT_MYSQL_TLS_HOST: mysql-tls
      TABLE_CRAFT_MYSQL_TLS_PORT: "3306"
      # A remote TiDB replaces the container when it answers (../db/tidbTarget.ts).
      TABLE_CRAFT_TIDB_HOST: ${TABLE_CRAFT_TIDB_E2E_HOST:-tidb}
      TABLE_CRAFT_TIDB_PORT: ${TABLE_CRAFT_TIDB_E2E_PORT:-4000}
      TABLE_CRAFT_TIDB_USER: ${TABLE_CRAFT_TIDB_USER:-root}
      TABLE_CRAFT_TIDB_PASSWORD: ${TABLE_CRAFT_TIDB_PASSWORD:-}
      TABLE_CRAFT_SSH_HOST: ssh
      TABLE_CRAFT_SSH_PORT: "22"
      TABLE_CRAFT_EVIDENCE_DIR: ${TABLE_CRAFT_EVIDENCE_DIR:-}
    volumes:
      - ../..:/work
      - node-modules:/work/node_modules
      - node-modules-plugin-api:/work/packages/plugin-api/node_modules
      - node-modules-core:/work/packages/core/node_modules
      - node-modules-desktop:/work/packages/desktop/node_modules
      - node-modules-postgres:/work/plugins/postgres/node_modules
      - node-modules-mysql:/work/plugins/mysql/node_modules
      - node-modules-sqlite:/work/plugins/sqlite/node_modules
      - bun-cache:/root/.bun/install/cache
      - electron-cache:/root/.cache/electron

  # TiDB 4.0, the oldest MySQL-compatible server users run against (plan 027): no plain KILL
  # QUERY, no recursive CTE. One process on its embedded store; root has no password and the
  # tests create what they need. Only `--profile tidb` starts it, which test/db/up.ts and the
  # headless runner pass unless a remote TiDB answers (test/db/tidbTarget.ts).
  tidb:
    profiles: ["tidb"]
    image: pingcap/tidb:v4.0.14
    platform: linux/amd64
    ports:
      - "127.0.0.1:${TABLE_CRAFT_TIDB_PORT:-54000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:10080/status"]
      interval: 1s
      timeout: 5s
      retries: 120

volumes:
  node-modules:
  node-modules-plugin-api:
  node-modules-core:
  node-modules-desktop:
  node-modules-postgres:
  node-modules-mysql:
  node-modules-sqlite:
  # Downloads only, shared by every checkout; node_modules stay per checkout.
  bun-cache:
    name: table-craft-e2e-bun-cache
  electron-cache:
    name: table-craft-e2e-electron-cache
