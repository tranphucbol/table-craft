<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Debian resolves system-ui to Noto Sans, whose line box is about 15% taller than San Francisco's,
  so pages laid out on macOS overflow in the box. Liberation Sans has Helvetica's metrics.
-->
<fontconfig>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
