# Plan 014, decisions 15 and 16: verify on Linux, package and smoke-test the packaged app on every
# target, and on a `v*` tag collect the installers into a draft release with the signed update
# manifest the installed apps read (decision 044), beside the plugin packages (decision 109).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Decision 107: api:check compares the plugin-api surface with the last v* tag's.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      # Decision 099: MySQL, TiDB and MariaDB only; every other server has its own job below.
      - run: bun run test:db

  changes:
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.filter.outputs.postgres }}
      oracle: ${{ steps.filter.outputs.oracle }}
      mssql: ${{ steps.filter.outputs.mssql }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            postgres:
              - "plugins/postgres/**"
              - "packages/plugin-api/src/testing/**"
              - "test/db/schema/postgres*"
            oracle:
              - "plugins/oracle/**"
              - "packages/plugin-api/src/testing/**"
              - "test/db/schema/oracle*/**"
              - "test/db/schema/oracle*"
            mssql:
              - "plugins/mssql/**"
              - "packages/plugin-api/src/testing/**"
              - "test/db/schema/mssql*"

  # Decision 099: one job per opt-in server, run when its plugin, the contract suite or its seed
  # changes. PostgreSQL also runs on a tag, so a release is checked against it.
  test-db:
    name: test:db (${{ matrix.database }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, oracle, mssql]
    if: >-
      needs.changes.outputs.postgres == 'true' || needs.changes.outputs.oracle == 'true' ||
      needs.changes.outputs.mssql == 'true' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Skip unless this server's paths changed
        id: wanted
        run: echo "run=${{ needs.changes.outputs[matrix.database] == 'true' || (matrix.database == 'postgres' && startsWith(github.ref, 'refs/tags/')) }}" >> "$GITHUB_OUTPUT"
      - if: steps.wanted.outputs.run == 'true'
        uses: actions/checkout@v7
      - if: steps.wanted.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - if: steps.wanted.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - if: steps.wanted.outputs.run == 'true'
        run: bun run test:db:${{ matrix.database }}

  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    # Decision 014: macOS is first-class, Windows and Linux best-effort.
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            blocking: true
            installer: |
              packages/desktop/release/*.dmg
              packages/desktop/release/*.zip
          - name: macOS x64
            runner: macos-15-intel
            blocking: true
            installer: |
              packages/desktop/release/*.dmg
              packages/desktop/release/*.zip
          - name: Windows x64
            runner: windows-latest
            blocking: false
            installer: packages/desktop/release/*.exe
          - name: Linux x64
            runner: ubuntu-latest
            blocking: false
            installer: packages/desktop/release/*.AppImage
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run desktop:package
      - name: Smoke-test the packaged app
        if: runner.os != 'Linux'
        run: bun run test:smoke:packaged
      # Ubuntu 24.04's AppArmor forbids the unprivileged user namespaces Chromium's sandbox needs,
      # and the runner has no display.
      - name: Smoke-test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum bun run test:smoke:packaged
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  # Decision 109: pack every optional plugin and plugin-api, load-check each tarball against this
  # host, and rehearse the publish with --dry-run. On a tag the tarballs go to the draft release;
  # publish-plugins.yml publishes exactly those once the release is published. Nothing publishes here.
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run plugins:pack
      - run: bun run plugins:check
      - run: bun run plugins:publish -- --dry-run
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: plugin-packages
          path: dist/plugin-packages/*.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, package, test-db, plugins]
    runs-on: ubuntu-latest
    # Decision 044: the signing key is the root of every installed app's trust. Keep it in this
    # environment's secrets and give the environment required reviewers.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: plugin-packages
          path: plugin-packages
      - name: Sign the update manifest
        env:
          TABLE_CRAFT_UPDATE_SIGNING_KEY: ${{ secrets.TABLE_CRAFT_UPDATE_SIGNING_KEY }}
        run: bun packages/desktop/scripts/update-manifest.ts --tag "$GITHUB_REF_NAME" --assets installers --out installers
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* plugin-packages/*.tgz --draft --generate-notes --repo "$GITHUB_REPOSITORY"
