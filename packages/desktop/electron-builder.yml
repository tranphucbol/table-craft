appId: dev.table-craft.desktop
productName: TableCraft

directories:
  output: release
  buildResources: build

# Decision 033: the bundles go into app.asar; the built-in plugins ship beside it as real files.
# Vite inlines every runtime dependency, so no node_modules ships. Optional plugins (decision 108)
# are downloaded from npm and never ship.
files:
  - dist/**
  - "!dist/resources/**"
  - "!dist/optional-plugins/**"
  - "!**/*.map"
  - "!node_modules/**"
extraResources:
  - from: dist/resources/plugins
    to: plugins
    filter:
      - "**/*"
      - "!**/*.map"
  # The window icon on Windows and Linux, where the window does not take it from the bundle.
  - from: build/icon.png
    to: icon.png
asar: true
npmRebuild: false
icon: build/icon.png
# The default leaves x64 unnamed, which reads as universal beside the arm64 DMG.
# Literal, not ${productName}: scripts/update-manifest.ts finds the installers by this name, and the
# live test's build renames the product (plan 020).
artifactName: TableCraft-${version}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  # The DMG is for people; the zip is what the in-app update downloads and unpacks with ditto
  # (decision 044).
  target:
    - dmg
    - zip
  # For a Developer ID build (CSC_LINK or CSC_NAME set) and notarisation. Without one,
  # scripts/package.ts signs ad hoc and turns the hardened runtime off: its library validation
  # refuses an ad-hoc-signed Electron Framework, which has no Team ID (plan 014 deviation).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target: nsis

linux:
  target: AppImage
  category: Development
  # Otherwise the binary is named after the package, `@table-craft/desktop`; Linux binaries are
  # lower case, so it is not `TableCraft` (decision 037).
  executableName: table-craft
